[package]
name = "dregg-sig-addr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Strict BIP-350 Bech32m post-quantum address codec (explicitly rejecting legacy BIP-173 Bech32), domain-separated cSHAKE256/Poseidon2 pubkey/script commitments, and non-malleable HybridPinnedEnvelope."

[features]
default = ["alloc"]
alloc = ["dregg-sig-accel/alloc"]
std = ["alloc", "dregg-sig-accel/std"]

[dependencies]
dregg-sig-accel = { path = "../accel", default-features = false }
dregg-sig-verified = { path = "../verified", default-features = false }
