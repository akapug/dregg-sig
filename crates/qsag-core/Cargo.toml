[package]
name = "qsag-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Zero-dependency no_std post-quantum threshold hash-based signatures (NIST FIPS 205 SLH-DSA, Corduroy, Baggy, JortsPoseidon2) with dealerless preprocessing and identifiable abort."

[features]
default = []
testing-ephemeral = []
std = ["qsag-asm/std", "qsag-accel/std"]

[dependencies]
qsag-accel = { path = "../qsag-accel", default-features = false }
qsag-verified = { path = "../qsag-verified", default-features = false }
# Strictly zero external crate dependencies.
qsag-asm = { path = "../qsag-asm", default-features = false, features = ["alloc"] }


[[example]]
name = "pants_bench"
required-features = ["testing-ephemeral"]

[[example]]
name = "slh_dsa_quickstart"
required-features = ["std"]
