[package]
name = "dregg-sig-quorum"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Generalized (t, n) quorum-switching Jorts protocols and isolated per-party wire-framed MPC nodes."

[dependencies]
dregg-sig-verified = { path = "../verified", default-features = false }
# Workspace crates only; no external dependencies.
dregg-sig-core = { path = "../core", default-features = false }
dregg-sig-asm = { path = "../asm", default-features = false }
dregg-sig-fts = { path = "../fts", default-features = false, features = ["alloc"] }

[features]
default = []
std = ["dregg-sig-core/std", "dregg-sig-asm/std"]
testing-ephemeral = ["dregg-sig-core/testing-ephemeral"]

[[example]]
name = "quorum_threaded_bench"
required-features = ["std", "testing-ephemeral"]

[dev-dependencies]
dregg-sig-accel = { path = "../accel", default-features = false }
dregg-sig-core = { path = "../core", features = ["testing-ephemeral"] }
dregg-sig-agg = { path = "../agg", features = ["std"] }
