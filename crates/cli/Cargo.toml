[package]
name = "dregg-sig-cli"
description = "Command-line key generation, signing, verification, aggregation, address, policy and KAT tool for dregg-sig, plus runnable examples."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dregg-sig"
path = "src/main.rs"

[dependencies]
# Strictly zero external crates.io dependencies.
dregg-sig-accel = { path = "../accel", features = ["std"] }
dregg-sig-addr = { path = "../addr", features = ["std"] }
dregg-sig-agg = { path = "../agg", features = ["std"] }
dregg-sig-asm = { path = "../asm", features = ["std"] }
dregg-sig-core = { path = "../core", features = ["std"] }
dregg-sig-cred = { path = "../cred", features = ["std"] }
dregg-sig-fts = { path = "../fts", features = ["std"] }
dregg-sig-hd = { path = "../hd", features = ["std"] }
dregg-sig-migrate = { path = "../migrate", features = ["std"] }
dregg-sig-policy = { path = "../policy", features = ["std"] }
dregg-sig-quorum = { path = "../quorum", features = ["std"] }

[dev-dependencies]
# Unit tests provision `fts-threshold` shares with the trusted dealer; the shipped binary never does.
dregg-sig-fts = { path = "../fts", features = ["std", "test-dealer"] }

[features]
default = []
test-dealer = ["dregg-sig-fts/test-dealer", "dregg-sig-policy/test-dealer"]
