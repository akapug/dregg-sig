[package]
name = "dregg-sig-fts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Post-quantum compact few-time hash signatures: constant-time bijective FrontierSumFts (Compact1122 1,122 B / Full256Bit 2,338 B profiles) and experimental height-independent 48-round bijective x^7 SPN MPC ParallelSeededFts."

[features]
test-dealer = []
testing-ephemeral = ["dregg-sig-core/testing-ephemeral"]
test-params = []
default = ["alloc"]
alloc = ["dregg-sig-accel/alloc"]
std = ["dregg-sig-core/std", "dregg-sig-asm/std", "alloc", "dregg-sig-accel/std"]

[dependencies]
dregg-sig-asm = { path = "../asm", default-features = false, features = ["alloc"] }
dregg-sig-verified = { path = "../verified", default-features = false }
dregg-sig-core = { path = "../core", default-features = false }
dregg-sig-accel = { path = "../accel", default-features = false }

[dev-dependencies]
dregg-sig-core = { path = "../core", features = ["testing-ephemeral"] }

[[example]]
name = "dealerless_bench"
required-features = ["std"]
