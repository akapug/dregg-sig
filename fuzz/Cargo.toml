[workspace]
resolver = "2"

[package]
name = "dregg-sig-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

dregg-sig-core = { path = "../crates/core", features = ["std"] }
dregg-sig-asm = { path = "../crates/asm", features = ["std"] }
dregg-sig-agg = { path = "../crates/agg", features = ["std"] }
dregg-sig-accel = { path = "../crates/accel", features = ["std"] }
# `test-dealer` exposes the trusted-dealer setup that produces the real threshold
# signature `fuzz_fips205_and_fts_decode` mutates.
dregg-sig-fts = { path = "../crates/fts", features = ["std", "test-dealer"] }
dregg-sig-quorum = { path = "../crates/quorum", features = ["std"] }

# Independent reference implementations for differential fuzzing.
sha3 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak", "sha3", "shake", "cshake", "sp800"] }
sha2 = "0.10"
ghash = "0.5"
p3-field = "0.2"
p3-goldilocks = "0.2"

[[bin]]
name = "fuzz_whir_agg_verify"
path = "fuzz_targets/fuzz_whir_agg_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hologram_and_subtree_decode"
path = "fuzz_targets/fuzz_hologram_and_subtree_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_quorum_frames"
path = "fuzz_targets/fuzz_quorum_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_diff_hashes_and_ntt"
path = "fuzz_targets/fuzz_diff_hashes_and_ntt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fips205_and_fts_decode"
path = "fuzz_targets/fuzz_fips205_and_fts_decode.rs"
test = false
doc = false
bench = false
